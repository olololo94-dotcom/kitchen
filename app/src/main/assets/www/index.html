<style>
/* Layout: one-column phone app, sticky header with pantry summary, bottom tab bar, slide-up sheets. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --sunk:#e8ece5; --ink:#1d2a24; --muted:#5d6b63; --line:#d5dcd3;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#dcebe1;
  --warn:#9a5c00; --warn-soft:#fbecd2; --bad:#b3362b; --bad-soft:#f8dcd8; --ok:#2f6b4f;
  --scrim:rgba(10,20,15,.45);
  --f-display:system-ui,"Roboto","Segoe UI",sans-serif;
  --f-body:system-ui,"Roboto","Segoe UI",sans-serif;
  --f-mono:ui-monospace,"Roboto Mono","DejaVu Sans Mono",monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1b2320; --sunk:#232d29; --ink:#e6ede8; --muted:#9aa9a1; --line:#2e3a35;
  --accent:#6cc497; --accent-ink:#0e1a14; --accent-soft:#1f3a2d;
  --warn:#f0b04a; --warn-soft:#3a2c14; --bad:#f07a6e; --bad-soft:#3d1f1c; --ok:#6cc497; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1b2320; --sunk:#232d29; --ink:#e6ede8; --muted:#9aa9a1; --line:#2e3a35;
  --accent:#6cc497; --accent-ink:#0e1a14; --accent-soft:#1f3a2d;
  --warn:#f0b04a; --warn-soft:#3a2c14; --bad:#f07a6e; --bad-soft:#3d1f1c; --ok:#6cc497; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}

h3{font:700 16px/1.25 var(--f-display);margin:0}
.summary{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:600;border:0}
.pill b{font-variant-numeric:tabular-nums}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.search{display:flex;gap:8px;margin-top:12px}
.search input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section.view{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.group-title{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:8px 0 -4px}

.item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tag{font:600 11px var(--f-mono);padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--accent-soft);color:var(--ok)}
.qty{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:10px;padding:2px}
.qty button{width:34px;height:34px;border:0;border-radius:8px;background:transparent;font-size:19px;font-weight:600}
.qty button:active{background:var(--line)}
.qty output{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.qty small{font-weight:500;color:var(--muted);font-size:11px}
.thumb{width:46px;height:46px;border-radius:11px;overflow:hidden;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--cat,var(--muted)) 16%,var(--surface));color:var(--cat,var(--muted))}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.thumb.lg{width:92px;height:92px;border-radius:16px}
.empty{padding:28px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:34ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 130px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-height:124px}
.tile.big{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-height:0;flex-direction:row;align-items:center;gap:14px}
.tile.big p{color:inherit;opacity:.88}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.tile p{margin:0;font-size:13px;color:var(--muted)}
.tile svg{flex:none}
.stripe{height:6px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px);opacity:.8;border-radius:2px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.switch input{width:46px;height:26px;accent-color:var(--accent)}
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:104px 1fr;text-align:left;padding:0}
.recipe img{width:104px;height:100%;min-height:104px;object-fit:cover;display:block}
.recipe .body{padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.recipe h3{font-size:16px}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.prefs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prefs label,.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.field{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.shop{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.shop:first-child{border-top:0}
.shop input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.shop.done .n{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;width:36px;height:36px;border-radius:8px;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;line-height:17px;padding:0 4px}
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.scanner{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;left:10%;right:10%;top:32%;height:22%;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scan-frame i{position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff5a4f;box-shadow:0 0 8px #ff5a4f}
.scan-ui{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.7) 30%)}
.scan-msg{color:#fff;text-align:center;margin:0;font-weight:600}
.scan-ui .row>.btn{flex:1 1 130px}
.install{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.install p{margin:0;font-size:13.5px}
.sheet>*{flex-shrink:0}
.sheet{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .stick{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:0 -16px calc(-20px - env(safe-area-inset-bottom,0px));padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 14px);z-index:2}
.sheet .stick .btn{width:100%}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.photo-row{display:flex;gap:14px;align-items:center}
.photo-row .btns{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.hint{font-size:12px;color:var(--accent);font-weight:600;min-height:16px}
.results{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.res{display:flex;gap:10px;align-items:center;padding:8px 10px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.res:first-child{border-top:0}
.res .t{min-width:0;display:flex;flex-direction:column}
.res .t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .thumb{width:40px;height:40px}
.review{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.review:first-child{border-top:0}
.review input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.review .grow{flex:1;min-width:0}
.review .grow input.nm{width:100%;border:0;background:transparent;font-weight:600;padding:0}
.review select{border:0;background:var(--sunk);border-radius:6px;font-size:12px;padding:2px 4px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.ing{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ing:first-child{border-top:0}
.ing .am{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r);display:block;background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 40px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.code{font:600 12px var(--f-mono);letter-spacing:.06em}
.note{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--bad);font-size:14px;margin:0}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg label{flex:1;text-align:center;padding:8px;border-radius:8px;font-weight:600;font-size:13px;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hdr-btns{display:flex;gap:8px}
.toolbar{display:flex;gap:8px;align-items:center;margin-top:10px}
.toolbar .chips{margin-top:0;flex:1;min-width:0}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted);flex:none;max-width:46%}
.chip .n{opacity:.6;font-variant-numeric:tabular-nums;margin-left:4px}
.progress{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.progress .bar{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.progress button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:13px;padding:4px}
.toast{display:flex;align-items:center;gap:14px;width:max-content;min-width:min(260px,calc(100% - 40px))}
.toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:800;padding:2px 0;text-transform:uppercase;font-size:13px;letter-spacing:.04em}
.set-group{display:flex;flex-direction:column;gap:6px}
.set-title{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:6px 2px 0}
.set-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:52px;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink)}
.set:first-child{border-top:0}
.set .lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
.set .lbl small{color:var(--muted);font-size:12.5px;line-height:1.35}
.set select,.set input[type=time]{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 8px;max-width:48%;flex:none}
.set .chev{color:var(--muted);font-size:20px;flex:none}
.set.danger{color:var(--bad)}
.tog{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.tog:checked{background:var(--accent)}
.tog:checked::after{left:21px}
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pics button{border:2px solid transparent;border-radius:12px;padding:0;background:#fff;aspect-ratio:1;overflow:hidden}
.pics img{width:100%;height:100%;object-fit:contain}
.welcome{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.welcome p{margin:0;opacity:.9}
.welcome .btn{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.welcome .btn.ghost{background:transparent;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 40%,transparent)}
.review-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- state ---------- */
const DEF_SETTINGS={lang:"auto",theme:"system",warnDays:3,defaultLoc:"fridge",autoExpiry:true,runOutToList:true,keepScanning:false,beep:true,receiptNames:"english",autoPictures:true,nameSearch:true,reminders:false,remindTime:"18:00",sort:"expiry",group:"place"};
let S = {items:[],shopping:[],barcodes:{},prefs:{diet:"Anything",missing:"3",servings:2},cooked:0,settings:{...DEF_SETTINGS},welcomed:false};
let ui = {tab:"pantry",q:"",loc:"all",recipes:null,recipeQuery:"",busy:false,recErr:"",pic:null,confirmWipe:false};
const ST = () => S.settings;
const W = () => Number(ST().warnDays)||3;
const autoExp = days => ST().autoExpiry && days ? addDays(days) : null;
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
const addDays = n => { const d=today(); d.setDate(d.getDate()+Number(n)); return iso(d); };
const daysLeft = e => e ? Math.round((new Date(e+"T00:00:00")-today())/864e5) : null;
const isCount = u => u==="pcs"||u==="pack";
const fmtQty = (q,u) => { const n=Math.round(q*100)/100; return isCount(u)?`${n}`:`${n} ${u}`; };
const same = (a,b) => KL.norm(a)===KL.norm(b);
const money = n => { try{ return Number(n).toLocaleString(I18N.lang==="en"?"en-IE":I18N.lang+"-LU",{style:"currency",currency:"EUR"}); }catch(e){ return "€"+Number(n).toFixed(2); } };
const fmtDate = d => { try{ return new Date(d+"T00:00:00").toLocaleDateString(I18N.lang==="en"?"en-GB":I18N.lang+"-LU",{day:"numeric",month:"short",year:"numeric"}); }catch(e){ return d; } };

function load(){
  try{ const r=localStorage.getItem(LS); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){}
  S.settings={...DEF_SETTINGS,...(S.settings||{})};
  if(S.keepScanning!==undefined){ S.settings.keepScanning=!!S.keepScanning; delete S.keepScanning; }
  applyTheme(); applyLang();
}
function applyLang(){
  const l=ST().lang==="auto"?I18N.autoLang():ST().lang;
  I18N.setLang(l);
  try{ if(N&&N.setLanguage) N.setLanguage(I18N.lang); }catch(e){}
}
function applyTheme(){ const t=ST().theme; if(t==="light"||t==="dark") document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme; }
let remindTimer=null;
function syncReminders(){
  clearTimeout(remindTimer);
  remindTimer=setTimeout(()=>{
    if(!N||!N.setReminders) return;
    const [h,m]=(ST().remindTime||"18:00").split(":").map(Number);
    try{ N.setReminders(JSON.stringify({lang:I18N.lang,enabled:!!ST().reminders,hour:h||18,minute:m||0,warnDays:W(),items:S.items.filter(i=>i.expiry).map(i=>({n:i.name,e:i.expiry}))})); }catch(e){}
  },400);
}
/* Undo: snapshot the whole state before a change */
let undoSnap=null;
function snapshot(){ const {sync,...rest}=S; undoSnap=JSON.stringify(rest); }
function undo(){ if(!undoSnap) return; const cur=S.sync; S=JSON.parse(undoSnap); if(cur) S.sync=cur; undoSnap=null; save(); render(); toast("Undone"); }
let saveWarned=false;
function save(){ saveQuiet(); if(window.KLSync) KLSync.schedule(); }
function saveQuiet(){ syncReminders(); try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){ if(!saveWarned){ saveWarned=true; toast("Phone storage for the app is full. Remove some photos or export a backup."); } } }
function commit(){ save(); render(); }

/* ---------- network ---------- */
let reqN=0;
async function getJSON(url,ms=12000){
  if(N&&N.httpGet){
    const id=String(++reqN);
    const body=await new Promise((res,rej)=>{ const t=setTimeout(()=>{ delete pending["http:"+id]; rej(new Error("timeout")); },ms+10000); pending["http:"+id]=b=>{ clearTimeout(t); res(b); }; N.httpGet(id,url); });
    if(body.startsWith("ERR:")) throw new Error(body.slice(4));
    return JSON.parse(body);
  }
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error("http "+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
const offline = () => navigator.onLine===false;

/* ---------- native bridge ---------- */
const pending = {};
window.onNative = (type,payload) => { const f=pending[type]; if(f){ delete pending[type]; f(payload); } else if(type==="toast") toast(payload); else if(type==="open"&&payload==="soon"){ closeSheet(); ui.tab="pantry"; ui.loc="soon"; render(); } };
function nativeCall(type,fn){ return new Promise(res=>{ pending[type]=res; fn(); }); }
const WP=window.WebPlatform;
function scanBarcode(){
  if(N) return nativeCall("barcode",()=>N.scanBarcode(ST().beep!==false));
  return WP.scanBarcode({beep:ST().beep!==false});
}
function pickPhoto(source){ /* -> dataURL thumbnail or "" */
  if(N) return nativeCall("photo",()=>N.takePhoto(source));
  return browserFile(source==="camera"?"fbCamera":"fbImage").then(f=>f?thumbFromFile(f):"");
}
async function readReceipt(source){ /* -> lines JSON string, "ERR:..." or "" */
  if(N) return nativeCall("ocr",()=>N.readReceipt(source));
  const f=await browserFile(source==="camera"?"fbCamera":"fbImage"); if(!f) return "";
  busySheet("Reading your receipt…");
  try{
    const lines=await WP.ocr(f,pct=>{ const el=layer.querySelector(".thinking"); if(el) el.lastChild.nodeValue=" "+I18N.tr("Reading your receipt…")+" "+pct+"%"; });
    return JSON.stringify(lines);
  }catch(e){ return "ERR:"+I18N.tr("Couldn't read the receipt. Check your internet the first time, then try again."); }
}
function pickCsv(){ if(N) return nativeCall("csv",()=>N.pickCsv()); return browserFile("fbCsv").then(f=>f?WP.readImportFile(f).catch(()=>{ toast("Couldn't open that file."); return ""; }):""); }
function browserFile(id){ return new Promise(res=>{ const el=document.getElementById(id); el.value=""; el.onchange=()=>res(el.files[0]||null); el.click(); }); }
async function thumbFromFile(file){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url;});
    const s=Math.min(img.naturalWidth,img.naturalHeight), c=document.createElement("canvas"); c.width=c.height=240;
    c.getContext("2d").drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,240,240);
    return c.toDataURL("image/jpeg",.78);
  } finally{ URL.revokeObjectURL(url); }
}
function saveFile(name,text){
  if(N){ N.saveFile(name,text); return true; }
  return WP.saveFile(name,text);
}
function shareText(title,text){
  if(N){ N.shareText(title,text); return; }
  WP.shareText(title,text).then(r=>{ if(r==="copied") toast("Copied"); else if(r==="fail") toast("Couldn't copy"); });
}

/* ---------- derived ---------- */
function stats(){
  const soon=S.items.filter(i=>{const d=daysLeft(i.expiry);return d!==null&&d>=0&&d<=W();}).length;
  const gone=S.items.filter(i=>{const d=daysLeft(i.expiry);return d!==null&&d<0;}).length;
  return {total:S.items.length,soon,gone,shop:S.shopping.filter(s=>!s.done).length};
}
function expTag(i){
  const d=daysLeft(i.expiry); if(d===null) return "";
  if(d<0) return `<span class="tag bad">expired ${-d}d ago</span>`;
  if(d===0) return `<span class="tag bad">use today</span>`;
  if(d===1) return `<span class="tag warn">tomorrow</span>`;
  if(d<=W()) return `<span class="tag warn">${d}d left</span>`;
  if(d<=30) return `<span class="tag">${d}d left</span>`;
  return `<span class="tag" translate="no">${new Date(i.expiry+"T00:00:00").toLocaleDateString(I18N.lang==="en"?"en-GB":I18N.lang+"-LU",{month:"short",year:"numeric"})}</span>`;
}
function thumbHTML(it,lg){
  const c=CATICON[it.category]||CATICON.Other, src=it.photo||it.image;
  const sz=lg?38:22;
  const icon=`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${c[1]}</svg>`;
  return `<span class="thumb${lg?" lg":""}" style="--cat:${c[0]}">${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(this.dataset.f))" data-f="${esc(icon)}">`:icon}</span>`;
}
function onList(name){ return S.shopping.some(s=>!s.done&&same(s.name,name)); }
function toList(name,qty){ if(!onList(name)) S.shopping.push({id:uid(),name,qty:qty||"",done:false}); }

/* ---------- render ---------- */
const app=document.getElementById("app");
function render(){
  const st=stats();
  document.getElementById("summary").innerHTML=
    `<span class="pill"><b>${st.total}</b> items</span>`+
    (st.soon?`<button class="pill warn" data-act="soon"><b>${st.soon}</b> use soon</button>`:"")+
    (st.gone?`<button class="pill bad" data-act="soon"><b>${st.gone}</b> expired</button>`:"")+
    (S.cooked?`<span class="pill"><b>${S.cooked}</b> meals cooked</span>`:"");
  const tabs=[["pantry","Pantry"],["add","Add"],["recipes","Recipes"],["shop","Shopping"]];
  document.getElementById("tabs").innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" ${ui.tab===k?'aria-current="page"':""}>${ICON[k]}${l}${k==="shop"&&st.shop?`<span class="badge">${st.shop}</span>`:""}</button>`).join("");
  app.innerHTML=({pantry:vPantry,add:vAdd,recipes:vRecipes,shop:vShop})[ui.tab]();
}

function installHint(){
  return `<div class="install"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:var(--accent)"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    <p><b>Install on your iPhone:</b> <span>tap the Share button in Safari, then “Add to Home Screen”.</span></p><button class="x" data-act="hideInstall" aria-label="Close">×</button></div>`;
}
function picProgress(){
  if(!ui.pic) return "";
  const {done,total,label}=ui.pic;
  return `<div class="progress"><span>${esc(label||"Finding pictures")} ${done}/${total}</span><span class="bar"><i style="width:${Math.round(done/Math.max(1,total)*100)}%"></i></span><button data-act="stopPics">Stop</button></div>`;
}
function vPantry(){
  if(!S.items.length) return `<section class="view"><div class="welcome">
    <h2 style="color:inherit">Welcome to Kitchen Ledger</h2>
    <p>Keep track of what's in your fridge, freezer and pantry, get warned before food expires, and find recipes for what you have.</p>
    <div class="row"><button class="btn" data-act="scan">Scan a barcode</button><button class="btn" data-act="receipt" data-src="gallery">Read a receipt</button></div>
    <div class="row"><button class="btn ghost" data-act="data">Import from KitchenPal or Excel</button><button class="btn ghost" data-act="demo">Try with example items</button></div>
  </div></section>`;
  const q=KL.norm(ui.q);
  const isSoon=i=>{const d=daysLeft(i.expiry);return d!==null&&d<=W();};
  let items=S.items.filter(i=>(ui.loc==="all"||ui.loc==="soon"||i.location===ui.loc)&&(!q||KL.norm(i.name+" "+(i.brand||"")+" "+i.category+" "+(i.base||"")).includes(q)));
  if(ui.loc==="soon") items=items.filter(isSoon);
  const so=ST().sort;
  const byName=(a,b)=>a.name.localeCompare(b.name);
  const byExp=(a,b)=>(daysLeft(a.expiry)??99999)-(daysLeft(b.expiry)??99999)||byName(a,b);
  items.sort(so==="name"?byName:so==="newest"?((a,b)=>String(b.added||"").localeCompare(String(a.added||""))||byName(a,b)):so==="amount"?((a,b)=>a.qty-b.qty||byName(a,b)):byExp);
  const cnt=k=>k==="all"?S.items.length:k==="soon"?S.items.filter(isSoon).length:S.items.filter(i=>i.location===k).length;
  const chip=(k,l)=>`<button class="chip" data-loc="${k}" aria-pressed="${ui.loc===k}">${l}<span class="n">${cnt(k)}</span></button>`;
  const sortSel=`<button class="iconbtn" data-act="sortSheet" aria-label="Sort and group" style="width:44px;height:44px;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>`;
  let html=`<section class="view"><div><div class="search"><input id="q" type="search" placeholder="Search ${S.items.length} items" value="${esc(ui.q)}" autocomplete="off">${sortSel}</div>
    <div class="chips">${chip("all","All")}${chip("soon","Use soon")}${chip("fridge","Fridge")}${chip("freezer","Freezer")}${chip("pantry","Pantry")}</div></div>`;
  html+=picProgress();
  if(WP&&WP.isIOS&&!WP.standalone&&!N&&!S.installHidden) html+=installHint();
  if(!items.length) html+=`<div class="empty"><p>${ui.loc==="soon"?`Nothing expires in the next ${W()} days.`:"Nothing matches."}</p></div>`;
  const row=i=>`
      <div class="item">${thumbHTML(i)}<button class="main" data-edit="${i.id}"><span class="name" translate="no">${esc(i.name)}</span>
        <span class="meta">${i.example?`<span class="tag">example</span>`:""}${i.brand?`<span translate="no">${esc(i.brand)}</span>`:""}${ST().group==="category"?`<span class="tag">${LOC[i.location]}</span>`:`<span class="tag">${esc(i.category)}</span>`}${expTag(i)}</span></button>
        <div class="qty"><button data-dec="${i.id}" aria-label="Use some ${esc(i.name)}">−</button><output>${fmtQty(i.qty,i.unit)}${isCount(i.unit)?` <small>${i.unit}</small>`:""}</output><button data-inc="${i.id}" aria-label="Add more ${esc(i.name)}">+</button></div></div>`;
  const gm=ST().group;
  if(gm==="none"){ if(items.length) html+=`<div class="list">${items.map(row).join("")}</div>`; }
  else {
    const keys=gm==="category"?CATS:["fridge","freezer","pantry"];
    const keyOf=i=>gm==="category"?(CATS.includes(i.category)?i.category:"Other"):i.location;
    for(const g of keys){
      const gi=items.filter(i=>keyOf(i)===g); if(!gi.length) continue;
      html+=`<div class="group-title">${gm==="category"?esc(g):LOC[g]} · ${gi.length}</div><div class="list">${gi.map(row).join("")}</div>`;
    }
  }
  return html+`</section>`;
}

function vRecipes(){
  const p=S.prefs;
  const opt=(arr,v)=>arr.map(a=>{const [val,lab]=Array.isArray(a)?a:[a,a];return `<option value="${val}" ${String(val)===String(v)?"selected":""}>${lab}</option>`;}).join("");
  let html=`<section class="view">
    <div class="card"><h2>What can I cook?</h2>
      <p class="note">Recipes ranked by what you already have, food that expires soon first.</p>
      <input class="field" id="rq" placeholder="Optional: lasagne, curry, soup…" value="${esc(ui.recipeQuery)}">
      <div class="prefs">
        <label>Diet<select class="field" id="pDiet">${opt(["Anything","Vegetarian","Vegan","Pescatarian"],p.diet)}</select></label>
        <label>Missing ingredients<select class="field" id="pMiss">${opt([["0","None"],["1","Up to 1"],["3","Up to 3"],["5","Up to 5"],["99","Any"]],p.missing)}</select></label>
      </div>
      <button class="btn primary" data-act="findRecipes" ${ui.busy?"disabled":""}>${ui.busy?"Searching…":"Find recipes"}</button>
      ${S.items.length?"":`<p class="note">Your kitchen is empty. Add items for better matches, or search a dish by name.</p>`}
    </div>`;
  if(ui.busy) html+=`<div class="thinking"><span class="dots"><i></i><i></i><i></i></span>${esc(ui.busy===true?"Searching recipes":ui.busy)}</div>`;
  if(ui.recErr) html+=`<p class="err">${esc(ui.recErr)}</p>`;
  if(ui.recipes&&ui.recipes.length){
    html+=ui.recipes.map((r,ix)=>`<button class="recipe" data-recipe="${ix}"><img src="${esc(r.thumb)}/preview" alt="" loading="lazy">
      <span class="body"><span class="meta"><span class="tag ${r.missing===0?"ok":""}">${r.have}/${r.total} in stock</span>${r.area?`<span class="tag" translate="no">${esc(r.area)}</span>`:""}</span>
      <h3 translate="no">${esc(r.title)}</h3><span class="note">${r.uses.length?`<span>Uses</span> <span translate="no">${esc(r.uses.slice(0,3).join(", "))}</span>`:"Needs shopping"}</span>
      <span class="prog"><i style="width:${Math.round(r.have/Math.max(1,r.total)*100)}%"></i></span></span></button>`).join("");
  }
  return html+`</section>`;
}

function vShop(){
  const low=S.items.filter(i=>i.minQty!=null&&i.qty<=i.minQty&&!onList(i.name));
  const open=S.shopping.filter(s=>!s.done), done=S.shopping.filter(s=>s.done);
  const row=s=>`<div class="shop ${s.done?"done":""}"><input type="checkbox" id="sh-${s.id}" data-toggle="${s.id}" ${s.done?"checked":""}><label for="sh-${s.id}" class="n" translate="no">${esc(s.name)}${s.qty?` <span class="note">· ${esc(s.qty)}</span>`:""}</label><button class="x" data-delshop="${s.id}" aria-label="Remove ${esc(s.name)}">×</button></div>`;
  let html=`<section class="view"><form class="search" id="shopForm"><input id="shopIn" placeholder="Add to shopping list" autocomplete="off"><button class="btn primary" type="submit">Add</button></form>`;
  if(low.length) html+=`<div class="card"><h3>Running low</h3><p class="note" translate="no">${low.map(i=>esc(i.name)).join(", ")}</p><button class="btn small" data-act="addLow">Add ${low.length} to list</button></div>`;
  if(!S.shopping.length) html+=`<div class="empty"><h2>Nothing to buy</h2><p>Items land here when you use them up, or when a recipe needs something you don't have.</p></div>`;
  if(open.length) html+=`<div class="group-title">To buy · ${open.length}</div><div class="list">${open.map(row).join("")}</div>`;
  if(done.length) html+=`<div class="group-title">In the basket · ${done.length}</div><div class="list">${done.map(row).join("")}</div>
    <div class="row"><button class="btn primary" data-act="stock">Put ${done.length} in the kitchen</button><button class="btn ghost" data-act="clearDone">Clear</button></div>`;
  if(open.length) html+=`<button class="btn ghost" data-act="shareList">Share list</button>`;
  return html+`</section>`;
}

/* ---------- sheets ---------- */
const layer=document.getElementById("layer");
function sheet(html){ layer.innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`; }
function closeSheet(){ layer.innerHTML=""; }
function busySheet(msg){ sheet(`<div class="thinking" style="padding:24px 4px"><span class="dots"><i></i><i></i><i></i></span>${esc(msg)}</div>`); }
function toast(t,withUndo){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status");
  const sp=document.createElement("span"); sp.textContent=t; d.appendChild(sp);
  if(withUndo&&undoSnap){ const b=document.createElement("button"); b.textContent="Undo"; b.onclick=()=>{ d.remove(); undo(); }; d.appendChild(b); }
  document.body.appendChild(d); setTimeout(()=>d.remove(),withUndo?5000:2600);
}

function addItem(n){
  const ex=S.items.find(x=>(n.barcode&&x.barcode===n.barcode)||(same(x.name,n.name)&&x.unit===n.unit&&x.location===n.location));
  if(ex){ ex.qty=Math.round((ex.qty+n.qty)*1000)/1000; if(n.expiry&&(!ex.expiry||n.expiry<ex.expiry)) ex.expiry=n.expiry; if(!ex.photo&&n.photo) ex.photo=n.photo; if(!ex.image&&n.image) ex.image=n.image; return ex; }
  const it={minQty:null,added:iso(today()),...n,id:uid()}; delete it.shelfDays; delete it.original; delete it.price; delete it.matched; delete it.keep;
  S.items.push(it); return it;
}
function rememberBarcode(n,shelfDays){
  if(!n.barcode) return;
  S.barcodes[n.barcode]={name:n.name,brand:n.brand,category:n.category,unit:n.unit,qty:n.qty,location:n.location,image:n.image||null,photo:n.photo||null,base:n.base||null,shelfDays:shelfDays??(n.expiry?Math.max(1,daysLeft(n.expiry)):null)};
}

    <div class="row full"><button class="btn primary" type="submit">${isNew?"Add to kitchen":"Save"}</button>${!isNew?`<button class="btn ghost" type="button" data-del="${it.id}">Remove</button>`:""}</div>

    const box=g("picBox"); const q=(g("fName").value+" "+g("fBrand").value).trim();

    if(offline()){ box.innerHTML=`<p class="note">You're offline. Pictures need internet.</p>`; return; }

  g("itemForm").onsubmit=e=>{

    rememberBarcode(n,sd);
    closeSheet(); commit();
    if(after) after();
  };
}

async function offSearch(q,size){
  const j=await getJSON(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=${size||10}&sort_by=unique_scans_n&fields=${OFF_FIELDS}`,15000);
  return (j.products||[]).map(p=>KL.mapOFF(p,p.code)).filter(p=>p&&p.name&&p.name!=="Unknown product");
}

/* ---------- flows ---------- */
async function scanFlow(){
  const code=await scanBarcode();
  if(!code){ closeSheet(); return; }
  const again=()=>{ if(ST().keepScanning) setTimeout(scanFlow,350); };
  const known=S.barcodes[code];
  if(known){
    snapshot();
    const it=addItem({...known,qty:known.qty||1,expiry:autoExp(known.shelfDays),barcode:code});
    if(N&&N.vibrate) N.vibrate();
    closeSheet(); commit(); toast(`+${fmtQty(known.qty||1,known.unit)} ${known.name} · now ${fmtQty(it.qty,it.unit)}`,true); again(); return;
  }
  if(offline()){ itemForm({barcode:code,qty:1},"New product",`<p class="note">You're offline, so the product can't be looked up. Fill it in once and this barcode is remembered.</p>`,again); return; }
  busySheet("Looking up the product…");
  let p=null;
  try{
    const j=await getJSON(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
    if(j&&j.status===1&&j.product) p=KL.mapOFF(j.product,code);
  }catch(e){}
  if(p&&p.name!=="Unknown product"){
    if(N&&N.vibrate) N.vibrate();
    itemForm({...p,expiry:autoExp(p.shelfDays)},"Found it",`<p class="note">Check the details. Next time this barcode is added in one tap.</p>`,again);
  } else {
    itemForm({barcode:code,qty:1},"New product",`<p class="note">This barcode isn't in Open Food Facts yet. Type the name (matching products appear below) and it's remembered for next time.</p>`,again);
  }
}

/* recipes */
const mealCache={}, filterCache={};
async function mealFilter(key){
  if(filterCache[key]) return filterCache[key];
  let j=await getJSON(MEALDB+"filter.php?i="+encodeURIComponent(key)).catch(()=>null);
  let meals=(j&&j.meals)||[];
  if(!meals.length&&key.endsWith("s")){ j=await getJSON(MEALDB+"filter.php?i="+encodeURIComponent(key.replace(/e?s$/,""))).catch(()=>null); meals=(j&&j.meals)||[]; }
  return filterCache[key]=meals;
}
async function mealLookup(id){
  if(mealCache[id]) return mealCache[id];
  const j=await getJSON(MEALDB+"lookup.php?i="+id).catch(()=>null);
  return mealCache[id]=(j&&j.meals&&j.meals[0])||null;
}
async function findRecipes(){
  if(offline()){ ui.recErr="You're offline. Recipes need internet."; render(); return; }
  ui.busy=true; ui.recErr=""; ui.recipes=null; render();
  try{
    let meals=[];
    const q=ui.recipeQuery.trim();
    if(q){
      const j=await getJSON(MEALDB+"search.php?s="+encodeURIComponent(q));
      meals=(j&&j.meals)||[];
      if(!meals.length){ const k=KL.guess(q).base||q; const f=await mealFilter(KL.norm(k).replace(/ /g,"_")); meals=(await Promise.all(f.slice(0,12).map(m=>mealLookup(m.idMeal)))).filter(Boolean); }
    } else {
      const seeds=KL.recipeSeeds(S.items,daysLeft,6);
      if(!seeds.length){ ui.busy=false; ui.recErr="Add some food to your kitchen first, or search a dish by name."; render(); return; }
      ui.busy="Checking recipes for "+seeds.map(s=>s.label).slice(0,3).join(", "); render();
      const lists=await Promise.all(seeds.map(s=>mealFilter(s.key)));
      const hits={}; lists.forEach((l,ix)=>l.forEach(m=>{ const h=hits[m.idMeal]||(hits[m.idMeal]={n:0,w:0}); h.n++; h.w+=6-ix; }));
      const ids=Object.keys(hits).sort((a,b)=>hits[b].n-hits[a].n||hits[b].w-hits[a].w).slice(0,16);
      meals=(await Promise.all(ids.map(mealLookup))).filter(Boolean);
    }
    const maxMiss=Number(S.prefs.missing);
    let res=meals.filter(m=>KL.dietOk(m,S.prefs.diet)).map(m=>{
      const sc=KL.scoreMeal(m,S.items);
      const uses=sc.ings.filter(x=>x.match).map(x=>(S.items.find(i=>i.id===x.match)||{}).name).filter(Boolean);
      const soon=sc.ings.filter(x=>x.match).map(x=>daysLeft((S.items.find(i=>i.id===x.match)||{}).expiry)).filter(d=>d!==null);
      return {id:m.idMeal,title:m.strMeal,thumb:m.strMealThumb,area:m.strArea&&m.strArea!=="Unknown"?m.strArea:"",category:m.strCategory,steps:splitSteps(m.strInstructions),youtube:m.strYoutube,source:m.strSource,ings:sc.ings,have:sc.have,total:sc.total,missing:sc.missing,uses,urgency:soon.length?Math.min(...soon):999};
    });
    if(!q) res=res.filter(r=>r.missing<=maxMiss);
    res.sort((a,b)=>a.missing-b.missing||a.urgency-b.urgency||b.have-a.have);
    ui.recipes=res.slice(0,10);
    if(!ui.recipes.length) ui.recErr=q?"No recipes found for that. Try another dish or an ingredient.":"No recipes fit with that few missing ingredients. Allow more missing ingredients, or search a dish.";
  }catch(e){ ui.recErr="Couldn't reach the recipe database. Check your internet and try again."; }
  ui.busy=false; render();
}
function splitSteps(t){
  t=String(t||"").replace(/\r/g,"").trim(); if(!t) return [];
  let parts=t.split(/\n+/).map(s=>s.replace(/^(step\s*\d+[:.]?|\d+[.)])\s*/i,"").trim()).filter(s=>s.length>2&&!/^step\s*\d+$/i.test(s));
  if(parts.length<2) parts=t.split(/(?<=\.)\s+(?=[A-Z])/).map(s=>s.trim()).filter(Boolean);
  return parts;
}
function showRecipe(ix){
  const r=ui.recipes[ix]; const missing=r.ings.filter(x=>!x.have);
  sheet(`<div class="sheet-head"><h2 translate="no">${esc(r.title)}</h2><button class="x" data-close aria-label="Close">×</button></div>
    <img class="hero" src="${esc(r.thumb)}" alt="">
    <div class="meta"><span class="tag ${r.missing===0?"ok":""}">${r.have}/${r.total} in stock</span>${r.area?`<span class="tag" translate="no">${esc(r.area)}</span>`:""}${r.category?`<span class="tag" translate="no">${esc(r.category)}</span>`:""}</div>
    <div class="card"><h3>Ingredients</h3><div>${r.ings.map(x=>`<div class="ing"><span>${x.have?(x.staple?`<span class="tag">basic</span> `:`<span class="tag ok">have</span> `):`<span class="tag warn">buy</span> `}<span translate="no">${esc(x.name)}</span></span><span class="am" translate="no">${esc(x.amount)}</span></div>`).join("")}</div>
    ${missing.length?`<button class="btn small" data-act="missing" data-ix="${ix}">Add ${missing.length} missing to shopping list</button>`:""}</div>
    <div class="card"><h3>Method</h3><ol class="steps" translate="no">${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    ${r.youtube?`<a class="btn small ghost" href="${esc(r.youtube)}" target="_blank" rel="noopener">Watch video</a>`:""}</div>

function cookedSheet(ix){
  const r=ui.recipes[ix];
  const used=r.ings.filter(x=>x.match).map(x=>({ing:x,it:S.items.find(i=>i.id===x.match)})).filter(x=>x.it);
  const uniq=[]; used.forEach(u=>{ if(!uniq.some(v=>v.it.id===u.it.id)) uniq.push(u); });
  const def=u=>{ const it=u.it; if(isCount(it.unit)) return Math.min(it.qty,1); const pq=KL.parseQuantity(u.ing.amount); if(pq&&pq.unit===it.unit) return Math.min(it.qty,pq.qty); if(pq&&pq.unit==="g"&&it.unit==="kg") return Math.min(it.qty,pq.qty/1000); if(pq&&pq.unit==="ml"&&it.unit==="l") return Math.min(it.qty,pq.qty/1000); return it.qty; };
  sheet(`<div class="sheet-head"><h2>What did you use?</h2><button class="x" data-close aria-label="Close">×</button></div>
    <p class="note">These amounts come out of your kitchen. Anything used up goes on the shopping list.</p>
    ${uniq.length?`<div class="list">${uniq.map(u=>`<div class="review">${thumbHTML(u.it)}<div class="grow"><b translate="no">${esc(u.it.name)}</b><div class="meta"><span>Recipe:</span> <span translate="no">${esc(u.ing.amount||"–")}</span> · <span>You have</span> <span translate="no">${fmtQty(u.it.qty,u.it.unit)}</span>${isCount(u.it.unit)?" <span>"+u.it.unit+"</span>":""}</div></div><input class="field" style="width:84px" type="number" step="any" min="0" inputmode="decimal" data-use="${u.it.id}" value="${Math.round(def(u)*1000)/1000}" aria-label="Amount of ${esc(u.it.name)} used"></div>`).join("")}</div>`:`<p class="note">None of your items were matched to this recipe.</p>`}
    <button class="btn primary" data-act="cookedDo">Done</button>`);
}

/* ---------- pictures ----------
   1. barcode -> Open Food Facts product photo
   2. known food -> TheMealDB ingredient picture
   3. otherwise (optional) -> Open Food Facts search by name (max ~9 per minute) */
let mealIngs=null;
async function mealIngredientMap(){
  if(mealIngs) return mealIngs;
  try{ const c=localStorage.getItem("kl-ings"); if(c){ mealIngs=JSON.parse(c); return mealIngs; } }catch(e){}
  try{
    const j=await getJSON(MEALDB+"list.php?i=list",15000);
    const m={}; (j.meals||[]).forEach(x=>{ if(x.strIngredient) m[KL.norm(x.strIngredient)]=x.strIngredient; });
    mealIngs=m; try{ localStorage.setItem("kl-ings",JSON.stringify(m)); }catch(e){}
  }catch(e){ mealIngs={}; }
  return mealIngs;
}
async function mealImage(name){
  if(!name) return null;
  const m=await mealIngredientMap(); const n=KL.norm(name); if(!n) return null;
  const words=n.split(" ");
  const cands=[n, n.replace(/s$/,""), n+"s", n.replace(/es$/,""), words[words.length-1], words[words.length-1].replace(/s$/,""), words[words.length-1]+"s", words[0]];
  for(const c of cands){ if(c&&m[c]) return "https://www.themealdb.com/images/ingredients/"+encodeURIComponent(m[c])+".png"; }
  return null;
}
let picStop=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function enrichItems(force){
  if(ui.pic||offline()) return;
  if(!force&&!ST().autoPictures) return;
  const need=i=>!i.image&&!i.photo||i.category==="Other";
  const todo=S.items.filter(i=>need(i)&&(force||!i.picChecked));
  if(!todo.length){ if(force) toast("All items already have pictures"); return; }
  picStop=false; let pics=0;
  ui.pic={done:0,total:todo.length,label:"Finding pictures"}; if(ui.tab==="pantry") render();
  const tick=()=>{ ui.pic.done++; if(ui.tab==="pantry"&&!layer.innerHTML){ const el=document.querySelector(".progress"); if(el) el.outerHTML=picProgress(); else render(); } };
  const nameQueue=[];
  // fast pass: barcodes (3 at a time) and ingredient pictures
  const work=todo.slice();
  async function worker(){
    while(work.length&&!picStop){
      const it=work.shift();
      if(it.barcode&&!it.offChecked){
        try{
          const j=await getJSON(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(it.barcode)}.json?fields=${OFF_FIELDS}`,15000);
          if(j&&j.status===1&&j.product){
            const p=KL.mapOFF(j.product,it.barcode);
            if(p.image&&!it.image&&!it.photo){ it.image=p.image; pics++; }
            if(it.category==="Other"&&p.category&&p.category!=="Other") it.category=p.category;
            if(!it.brand&&p.brand) it.brand=p.brand;
            if(!S.barcodes[it.barcode]) S.barcodes[it.barcode]={name:it.name,brand:it.brand,category:it.category,unit:it.unit,qty:it.qty,location:it.location,image:it.image||null,photo:it.photo||null,base:it.base||null,shelfDays:p.shelfDays};
          }
        }catch(e){}
        it.offChecked=true;
      }
      if(!it.image&&!it.photo){
        const base=it.base||KL.guess(it.name).base;
        const mi=base?await mealImage(base):null;
        if(mi){ it.image=mi; pics++; }
      }
      if(!it.image&&!it.photo&&ST().nameSearch) nameQueue.push(it);
      else { it.picChecked=true; tick(); }
    }
  }
  await Promise.all([worker(),worker(),worker()]);
  save();
  // slow pass: search by name, spaced out to respect Open Food Facts limits
  if(nameQueue.length&&!picStop){ ui.pic.label="Searching pictures by name"; }
  for(const it of nameQueue){
    if(picStop||offline()) break;
    try{
      const res=await offSearch((it.name+" "+(it.brand||"")).trim(),5);
      const hit=res.find(p=>p.image);
      if(hit&&!it.image&&!it.photo){ it.image=hit.image; pics++; if(it.category==="Other"&&hit.category!=="Other") it.category=hit.category; }
    }catch(e){}
    it.picChecked=true; tick(); save();
    await sleep(6500);
  }
  ui.pic=null; save(); render();
  toast(picStop?`Stopped. ${pics} pictures added.`:`${pics} pictures added`);
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-loc],[data-inc],[data-dec],[data-edit],[data-del],[data-act],[data-recipe],[data-delshop],[data-close]");
  if(!t) return;
  if(t.hasAttribute("data-close")){ if(e.target===t||t.tagName==="BUTTON") closeSheet(); return; }
  if(t.dataset.tab){ ui.tab=t.dataset.tab; render(); scrollTo(0,0); return; }
  if(t.dataset.loc){ ui.loc=t.dataset.loc; render(); return; }
  if(t.dataset.inc||t.dataset.dec){
    const id=t.dataset.inc||t.dataset.dec, it=S.items.find(x=>x.id===id); if(!it) return;
    const step=it.unit==="g"||it.unit==="ml"?(it.qty>500?100:50):it.unit==="kg"||it.unit==="l"?0.25:1;
    const nq=Math.max(0,Math.round((it.qty+(t.dataset.inc?step:-step))*1000)/1000);
    if(nq===0){ snapshot(); it.qty=0; S.items=S.items.filter(x=>x.id!==id); if(ST().runOutToList){ toList(it.name.replace(" (example)","")); toast(`${it.name} used up and added to the shopping list`,true); } else toast(`${it.name} used up`,true); }
    else it.qty=nq;
    commit(); return;
  }
  if(t.dataset.edit){ const it=S.items.find(x=>x.id===t.dataset.edit); if(it) itemForm(it,"Edit item"); return; }
  if(t.dataset.del){ snapshot(); const it=S.items.find(x=>x.id===t.dataset.del); S.items=S.items.filter(x=>x.id!==t.dataset.del); closeSheet(); commit(); toast(`${it?it.name:"Item"} removed`,true); return; }
  if(t.dataset.recipe){ showRecipe(+t.dataset.recipe); return; }
  if(t.dataset.delshop){ S.shopping=S.shopping.filter(s=>s.id!==t.dataset.delshop); commit(); return; }
  const a=t.dataset.act;
  if(a==="soon"){ ui.tab="pantry"; ui.loc="soon"; render(); }
  else if(a==="scan") scanFlow();
  else if(a==="receipt") receiptFlow(t.dataset.src||"camera");
  else if(a==="searchProducts") itemForm({qty:1},"Search products",`<p class="note">Type a product name. Pick a match to fill in the details and picture.</p>`);
  else if(a==="manual") itemForm({qty:1,unit:"pcs"},"Add an item");
  else if(a==="data") dataSheet();
  else if(a==="sortSheet") sortSheet();
  else if(a==="hhJoinOpen"){ hh={mode:"join",err:"",busy:false}; refreshHH(); setTimeout(()=>document.getElementById("hhCode")?.focus(),50); }
  else if(a==="hhCancel"){ hh={mode:null,err:"",busy:false}; refreshHH(); }
  else if(a==="hhCreate"){
    if(offline()){ hh.err=I18N.tr("You're offline. Connect to the internet to create a household."); refreshHH(); return; }
    hh.busy=true; hh.err=""; refreshHH();
    try{ await KLSync.create(); hh={mode:null,err:"",busy:false}; toast("Household created. Tap Invite to share the code."); }
    catch(e){ hh.busy=false; hh.err=I18N.tr("Couldn't create the household. Check your internet and the Firebase setup, then try again."); console.error(e); }
    refreshHH(); render();
  }
  else if(a==="hhJoin"){
    const code=document.getElementById("hhCode").value, mode=(layer.querySelector('input[name="hhMode"]:checked')||{}).value||"merge";
    if(offline()){ hh.err=I18N.tr("You're offline. Connect to the internet to join."); refreshHH(); return; }
    hh.busy=true; hh.err=""; refreshHH(); const inp=document.getElementById("hhCode"); if(inp) inp.value=code;
    try{ await KLSync.join(code,mode); hh={mode:null,err:"",busy:false}; toast("You joined the household"); render(); }
    catch(e){ hh.busy=false; hh.err=I18N.tr(e.user||"Couldn't join. Check your internet and the code, then try again."); console.error(e); }
    refreshHH(); const inp2=document.getElementById("hhCode"); if(inp2) inp2.value=code;
  }
  else if(a==="hhShare"){ shareText(I18N.tr("Kitchen Ledger household"),inviteText(KLSync.fmtCode(S.sync.hid))); }
  else if(a==="hhSync"){ KLSync.syncNow(); refreshHH(); }
  else if(a==="hhLeave"){ hh.confirmLeave=true; refreshHH(); }
  else if(a==="hhLeaveNo"){ hh.confirmLeave=false; refreshHH(); }
  else if(a==="hhLeaveYes"){ hh.confirmLeave=false; KLSync.leave(); refreshHH(); toast("You left the household"); }
  else if(a==="hideInstall"){ S.installHidden=true; commit(); }
  else if(a==="settings"){ ui.confirmWipe=false; settingsSheet(); }
  else if(a==="stopPics"){ picStop=true; }
  else if(a==="findPics"){ closeSheet(); ui.tab="pantry"; render(); S.items.forEach(i=>{ if(!i.image&&!i.photo) i.picChecked=false; }); enrichItems(true); }
  else if(a==="testReminder"){ N.testReminder(); toast("Test reminder sent"); }
  else if(a==="backup"){ const name=`kitchen-ledger-backup-${iso(today())}.json`; const data=JSON.stringify({app:"KitchenLedger",version:1,saved:new Date().toISOString(),state:S}); if(!saveFile(name,data)) shareText("Kitchen Ledger backup",data); }
  else if(a==="restore"){
    const txt=await pickCsv(); if(!txt) return;
    let d=null; try{ d=JSON.parse(txt.replace(/^\uFEFF/,"")); }catch(e){}
    if(!d||d.app!=="KitchenLedger"||!d.state){ toast("That isn't a Kitchen Ledger backup file"); return; }
    snapshot(); const curSync=S.sync; S=Object.assign({items:[],shopping:[],barcodes:{}},d.state); delete S.sync; if(curSync) S.sync=curSync; S.settings={...DEF_SETTINGS,...(S.settings||{})}; applyTheme(); closeSheet(); commit(); toast(`Backup restored: ${S.items.length} items`,true);
  }
  else if(a==="delExamples"){ snapshot(); S.items=S.items.filter(i=>!(i.example||/\(example\)$/.test(i.name))); closeSheet(); commit(); toast("Example items removed",true); }
  else if(a==="wipe"){ ui.confirmWipe=true; settingsSheet(); }
  else if(a==="wipeNo"){ ui.confirmWipe=false; settingsSheet(); }
  else if(a==="wipeYes"){ snapshot(); S.items=[]; S.shopping=[]; ui.confirmWipe=false; closeSheet(); commit(); toast("Everything deleted",true); }
  else if(a==="rAll"){ const boxes=[...layer.querySelectorAll("[data-keep]")]; const anyOn=boxes.some(b=>b.checked); boxes.forEach(b=>b.checked=!anyOn); t.textContent=anyOn?"Select all":"Select none"; }
  else if(a==="itemToList"){ const it=S.items.find(i=>i.id===t.dataset.id); if(it){ toList(it.name); commit(); t.textContent="On the shopping list ✓"; } }
  else if(a==="demo"){
    const ex=[["Whole milk","Luxlait",1,"l",4],["Eggs","",6,"pcs",12],["Spinach","",200,"g",2],["Chicken breast","",400,"g",1],["Spaghetti","",500,"g",300],["Chopped tomatoes","",2,"pcs",500],["Onions","",3,"pcs",20],["Garlic","",1,"pcs",40],["Frozen peas","",450,"g",180],["Parmesan","",150,"g",25],["Potatoes","",1.5,"kg",21]];
    ex.forEach(([name,brand,qty,unit,d])=>{ const gs=KL.guess(name); addItem({example:true,name:(I18N.food(gs.base)||name),brand,qty,unit,category:gs.category,location:gs.location,base:gs.base,expiry:addDays(d)}); });
    commit(); toast("Example items loaded. Remove them any time.");
  }
  else if(a==="findRecipes"){ readPrefs(); save(); findRecipes(); }
  else if(a==="missing"){ const r=ui.recipes[+t.dataset.ix]; r.ings.filter(x=>!x.have).forEach(x=>toList(x.name,x.amount)); commit(); closeSheet(); toast("Added to shopping list"); }
  else if(a==="cookedAsk") cookedSheet(+t.dataset.ix);
  else if(a==="cookedDo"){
    snapshot(); let n=0;
    layer.querySelectorAll("[data-use]").forEach(inp=>{ const it=S.items.find(i=>i.id===inp.dataset.use); const u=parseFloat(inp.value)||0; if(!it||u<=0) return; n++;
      it.qty=Math.max(0,Math.round((it.qty-u)*1000)/1000); if(it.qty===0){ S.items=S.items.filter(i=>i.id!==it.id); if(ST().runOutToList) toList(it.name.replace(" (example)","")); } });
    S.cooked=(S.cooked||0)+1; closeSheet(); commit(); toast(`Enjoy! ${n} items updated`,true);
  }
  else if(a==="saveReceipt"){
    snapshot(); let n=0;
    receiptRows.forEach(x=>{ const keep=layer.querySelector(`[data-keep="${x._id}"]`); if(!keep||!keep.checked) return;
      const nm=layer.querySelector(`[data-rname="${x._id}"]`).value.trim()||x.name;
      const cat=layer.querySelector(`[data-rcat="${x._id}"]`).value, loc=layer.querySelector(`[data-rloc="${x._id}"]`).value;
      const gs=KL.guess(nm); const days=gs.base&&gs.category===cat?gs.shelfDays:(x.shelfDays&&x.category===cat?x.shelfDays:CAT_DAYS[cat]);
      addItem({name:nm,brand:"",qty:x.qty||1,unit:x.unit||"pcs",category:cat,location:loc,base:gs.base||x.english||null,expiry:autoExp(days)});
      S.shopping=S.shopping.filter(s=>s.done||!(same(s.name,nm)||(gs.base&&same(s.name,gs.base)))); n++; });
    closeSheet(); ui.tab="pantry"; ui.loc="all"; commit(); toast(`${n} items added`,true);
    setTimeout(()=>enrichItems(),800);
  }
  else if(a==="addLow"){ S.items.filter(i=>i.minQty!=null&&i.qty<=i.minQty).forEach(i=>toList(i.name)); commit(); }
  else if(a==="clearDone"){ S.shopping=S.shopping.filter(s=>!s.done); commit(); }
  else if(a==="stock"){
    snapshot(); const done=S.shopping.filter(s=>s.done);
    done.forEach(s=>{ const m=Object.values(S.barcodes).find(b=>same(b.name,s.name)); const ex=S.items.find(i=>same(i.name,s.name));
      if(ex) ex.qty=Math.round((ex.qty+(m?.qty||1))*1000)/1000;
      else { const gs=KL.guess(s.name); const cat=m?.category||gs.category; const days=m?.shelfDays??gs.shelfDays;
        addItem({name:s.name,brand:m?.brand||"",qty:m?.qty||1,unit:m?.unit||"pcs",category:cat,location:m?.location||gs.location,image:m?.image||null,photo:m?.photo||null,base:gs.base,expiry:autoExp(days)}); } });
    S.shopping=S.shopping.filter(s=>!s.done); commit(); toast(`${done.length} items put away`,true); setTimeout(()=>enrichItems(),800);
  }
  else if(a==="shareList"){ shareText("Shopping list",S.shopping.filter(s=>!s.done).map(s=>"• "+s.name+(s.qty?" ("+s.qty+")":"")).join("\n")); }
  else if(a==="exportCsv"){ const name=`kitchen-inventory-${iso(today())}.csv`; if(!saveFile(name,KL.toCSV(S.items))) shareText("Kitchen inventory",KL.toCSV(S.items)); }
  else if(a==="shareCsv"){ if(N) N.shareFile(`kitchen-inventory-${iso(today())}.csv`,KL.toCSV(S.items)); else WP.saveFile(`kitchen-inventory-${iso(today())}.csv`,KL.toCSV(S.items)); }
  else if(a==="importCsv"){ const txt=await pickCsv(); if(!txt) return; if(/^\s*\{/.test(txt.replace(/^\uFEFF/,""))){ toast("That's a backup file. Use Settings → Restore a backup."); return; } importPreview=KL.csvToItems(txt,iso(today())); showImport(); }
  else if(a==="doImport"){
    snapshot(); const mode=(layer.querySelector('input[name="imode"]:checked')||{}).value||"merge";
    if(mode==="replace") S.items=[];
    importPreview.items.forEach(n=>{ addItem(n); if(n.barcode&&!S.barcodes[n.barcode]) rememberBarcode(n); });
    const n=importPreview.items.length; importPreview=null; closeSheet(); ui.tab="pantry"; ui.loc="all"; commit(); toast(`${n} items imported`,true);
    setTimeout(()=>enrichItems(),1200);
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.toggle){ const s=S.shopping.find(x=>x.id===t.dataset.toggle); if(s){ s.done=t.checked; commit(); } return; }
  if(t.dataset.set){ onSetting(t); return; }
  if(t.name==="sortBy"||t.name==="groupBy"){ S.settings[t.name==="sortBy"?"sort":"group"]=t.value; save(); render(); return; }
  if(t.name==="rnames"){ S.settings.receiptNames=t.value; save();
    const keep={}; layer.querySelectorAll("[data-keep]").forEach(b=>keep[b.dataset.keep]=b.checked);
    receiptRows.forEach(x=>{ const c=layer.querySelector(`[data-rcat="${x._id}"]`), l=layer.querySelector(`[data-rloc="${x._id}"]`); if(c) x.category=c.value; if(l) x.location=l.value; });
    const sc=layer.querySelector(".sheet")?.scrollTop||0; showReceipt(); layer.querySelectorAll("[data-keep]").forEach(b=>b.checked=keep[b.dataset.keep]!==false); const sh=layer.querySelector(".sheet"); if(sh) sh.scrollTop=sc; return; }
  if(t.id==="pDiet"||t.id==="pMiss"){ readPrefs(); save(); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ ui.q=e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById("q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }
  if(e.target.id==="rq") ui.recipeQuery=e.target.value;
});
document.addEventListener("submit",e=>{
  if(e.target.id==="shopForm"){ e.preventDefault(); const v=document.getElementById("shopIn").value.trim(); if(!v) return; S.shopping.push({id:uid(),name:v,done:false}); commit(); setTimeout(()=>document.getElementById("shopIn")?.focus(),0); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
function readPrefs(){ const g=id=>document.getElementById(id); if(!g("pDiet")) return; S.prefs={...S.prefs,diet:g("pDiet").value,missing:g("pMiss").value}; ui.recipeQuery=g("rq").value.trim(); }
/* Android back button */
window.onBack=()=>{ if(layer.innerHTML){ closeSheet(); return true; } if(ui.tab!=="pantry"){ ui.tab="pantry"; render(); return true; } return false; };

load(); I18N.start(); render();
syncReminders();
try{ if(N&&N.takeOpen&&N.takeOpen()==="soon"){ ui.loc="soon"; render(); } }catch(e){}
setTimeout(()=>enrichItems(),2500);
if(window.KLSync) KLSync.start({getS:()=>S,save:saveQuiet,render:()=>{ if(!layer.innerHTML||!document.querySelector("#itemForm,[data-keep]")) render(); },onStatus:()=>{ if(document.getElementById("hhBox")) document.getElementById("hhBox").outerHTML=householdHTML(); }});
})();
</script>
</body>
</html>
