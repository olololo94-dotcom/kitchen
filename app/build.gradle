plugins {
    id 'com.android.application'
}

android {
    namespace 'lu.kitchenledger'
    compileSdk 34

    defaultConfig {
        applicationId "lu.kitchenledger"
        minSdk 26
        targetSdk 34
        // CI passes the run number so every build installs as an update
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        release {
            storeFile file("kitchenledger.jks")
            storePassword "kitchenledger"
            keyAlias "kitchenledger"
            keyPassword "kitchenledger"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
